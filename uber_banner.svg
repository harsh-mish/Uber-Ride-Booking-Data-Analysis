<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Uber Ride Booking Data Analysis" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#07110D"/>
      <stop offset="100%" stop-color="#0B1F17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#06C167" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06C167" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- City skyline -->
  <g fill="#0E1A14" fill-opacity="0.95">
    <rect x="20" y="170" width="60" height="90"/>
    <rect x="90" y="140" width="50" height="120"/>
    <rect x="150" y="185" width="70" height="75"/>
    <rect x="235" y="125" width="55" height="135"/>
    <rect x="300" y="165" width="65" height="95"/>
    <rect x="375" y="150" width="45" height="110"/>
    <rect x="780" y="155" width="60" height="105"/>
    <rect x="850" y="120" width="55" height="140"/>
    <rect x="915" y="170" width="70" height="90"/>
    <rect x="995" y="135" width="50" height="125"/>
    <rect x="1055" y="165" width="65" height="95"/>
    <rect x="1130" y="145" width="60" height="115"/>
  </g>
  <g fill="#06C167" fill-opacity="0.35">
    <rect x="104" y="156" width="8" height="8"/><rect x="120" y="172" width="8" height="8"/><rect x="104" y="188" width="8" height="8"/>
    <rect x="250" y="142" width="8" height="8"/><rect x="266" y="158" width="8" height="8"/><rect x="250" y="190" width="8" height="8"/>
    <rect x="388" y="168" width="8" height="8"/><rect x="388" y="200" width="8" height="8"/>
    <rect x="864" y="136" width="8" height="8"/><rect x="880" y="168" width="8" height="8"/><rect x="864" y="200" width="8" height="8"/>
    <rect x="1008" y="152" width="8" height="8"/><rect x="1024" y="184" width="8" height="8"/>
    <rect x="1144" y="162" width="8" height="8"/><rect x="1160" y="194" width="8" height="8"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.22">
    <rect x="40" y="188" width="8" height="8"/><rect x="56" y="220" width="8" height="8"/>
    <rect x="170" y="204" width="8" height="8"/><rect x="320" y="184" width="8" height="8"/>
    <rect x="800" y="174" width="8" height="8"/><rect x="936" y="190" width="8" height="8"/>
    <rect x="1075" y="184" width="8" height="8"/>
  </g>

  <!-- Pickup pin -->
  <g transform="translate(1055,62)">
    <circle r="14" fill="none" stroke="#06C167" stroke-width="2">
      <animate attributeName="r" values="14;34;14" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 18 C-14 2 -16 -6 -16 -12 A16 16 0 1 1 16 -12 C16 -6 14 2 0 18Z" fill="#06C167" filter="url(#soft)"/>
    <circle cy="-12" r="6" fill="#000000"/>
  </g>
  <g transform="translate(145,70)" opacity="0.8">
    <circle r="7" fill="#FFFFFF"/>
    <circle r="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.6">
      <animate attributeName="r" values="8;22;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Route line between pickup and drop -->
  <path d="M145 70 C 400 20, 800 130, 1055 50" fill="none" stroke="#06C167" stroke-width="2" stroke-dasharray="6 10" stroke-opacity="0.55">
    <animate attributeName="stroke-dashoffset" values="0;-64" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Title -->
  <text x="600" y="102" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="6" filter="url(#shadow)">UBER RIDE BOOKING</text>
  <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" fill="#06C167" letter-spacing="10" filter="url(#shadow)">DATA ANALYSIS</text>
  <text x="600" y="198" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#D1D5DB" letter-spacing="2.5">End-to-End EDA with Python  •  150,000 Bookings  •  34 Visualizations</text>

  <!-- Road -->
  <rect x="0" y="252" width="1200" height="88" fill="url(#road)"/>
  <rect x="0" y="252" width="1200" height="3" fill="#06C167" fill-opacity="0.8"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="4" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" values="0;-70" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- Car -->
  <g transform="translate(-320,194)">
    <animateTransform attributeName="transform" type="translate" from="-320 194" to="1250 194" dur="10s" repeatCount="indefinite"/>
    <polygon points="148,40 330,18 330,62" fill="url(#beam)"/>
    <path d="M0 42 h20 l14 -24 h66 l22 24 h20 a6 6 0 0 1 6 6 v14 h-148 v-14 a6 6 0 0 1 0 -6z" fill="#06C167"/>
    <path d="M40 40 l10 -17 h28 v17z" fill="#04140D"/>
    <path d="M84 40 v-17 h18 l15 17z" fill="#04140D"/>
    <rect x="140" y="46" width="10" height="7" rx="2" fill="#FFF7B0"/>
    <rect x="0" y="46" width="6" height="7" rx="2" fill="#EF4444"/>
    <circle cx="36" cy="62" r="12" fill="#0A0A0A" stroke="#D1D5DB" stroke-width="3"/>
    <circle cx="118" cy="62" r="12" fill="#0A0A0A" stroke="#D1D5DB" stroke-width="3"/>
    <circle cx="36" cy="62" r="4" fill="#D1D5DB"/>
    <circle cx="118" cy="62" r="4" fill="#D1D5DB"/>
  </g>
</svg>
